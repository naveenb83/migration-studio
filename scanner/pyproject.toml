[project]
name = "migration-studio-scanner"
version = "0.1.0"
description = "Clean-room offline estate scanner (SSIS, SQL Agent, T-SQL, framework YAML) for Migration Studio WP2."
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "sqlglot==30.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
